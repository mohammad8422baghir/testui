name: Build Xray Proxy APK
on: [push, workflow_dispatch]

env:
  # رفع اخطار منسوخ شدن Node.js 20
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false # رفع اخطار پیدا نشدن فایل go.sum
          
      - name: Install Gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init
          
      - name: Build Android Library
        run: |
          mkdir -p app/libs # رفع خطای پیدا نشدن پوشه libs
          cd xray
          go mod tidy
          go get golang.org/x/mobile/bind
          gomobile bind -v -target=android -androidapi 21 -o ../app/libs/xray.aar
          
      - name: Build APK
        run: bash ./gradlew assembleDebug
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XrayProxy-Debug
          path: app/build/outputs/apk/debug/*.apk
