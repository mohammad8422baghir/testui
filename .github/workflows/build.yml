name: Build Xray Proxy APK
on: [push, workflow_dispatch]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false
          
      - name: Install Gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init
          
      - name: Build Android Library (Xray Core)
        run: |
          mkdir -p app/libs
          cd xray
          go mod tidy
          go get golang.org/x/mobile/bind
          gomobile bind -v -target=android -androidapi 21 -o ../app/libs/xray.aar
          
      - name: Scaffold Android App
        run: |
          # ساخت فایل تنظیمات گریدل
          cat << 'EOF' > settings.gradle
          rootProject.name = "XrayProxy"
          include ':app'
          EOF
          
          # ساخت بیلد گریدل روت
          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.0' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF
          
          # ساخت بیلد گریدل اپلیکیشن
          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.example.xrayproxy'
              compileSdk 33
              defaultConfig {
                  applicationId "com.example.xrayproxy"
                  minSdk 21
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }
          }
          dependencies {
              implementation files('libs/xray.aar')
          }
          EOF
          
          # ساخت مانیفست اندروید
          mkdir -p app/src/main/java/com/example/xrayproxy
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="Xray Local Proxy">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          
          # ساخت کلاس اصلی جاوا (MainActivity) و رابط کاربری ساده
          cat << 'EOF' > app/src/main/java/com/example/xrayproxy/MainActivity.java
          package com.example.xrayproxy;
          import android.app.Activity;
          import android.os.Bundle;
          import android.widget.TextView;
          import xrayproxy.Xrayproxy;
          
          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  
                  // ایجاد یک صفحه ساده برای نمایش وضعیت
                  TextView tv = new TextView(this);
                  tv.setText("✅ پراکسی Xray با موفقیت روی 127.0.0.1:10808 در حال اجراست.\n\nدی‌ان‌اس شکن ست شد.\n\nحالا می‌توانید V2rayNG را متصل کنید.\n(این برنامه را در پس‌زمینه باز نگه دارید)");
                  tv.setPadding(50, 50, 50, 50);
                  tv.setTextSize(18f);
                  setContentView(tv);
                  
                  // اجرای هسته در پس‌زمینه
                  new Thread(() -> {
                      try {
                          String config = "{\"dns\":{\"servers\":[\"170.22.122.101\",\"185.51.200.1\",\"8.8.8.8\"]},\"inbounds\":[{\"port\":10808,\"listen\":\"127.0.0.1\",\"protocol\":\"socks\",\"settings\":{\"udp\":true}}],\"outbounds\":[{\"protocol\":\"freedom\",\"settings\":{\"domainStrategy\":\"UseIP\"}}]}";
                          Xrayproxy.startXray(config);
                      } catch (Exception e) { e.printStackTrace(); }
                  }).start();
              }
          }
          EOF
          
      - name: Build APK with System Gradle
        run: gradle assembleDebug
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XrayProxy-Debug
          path: app/build/outputs/apk/debug/*.apk
